/* ===== HOME RATA (gaya SS-24) ===== */
.mix .sp{min-width:0}
.mix .fb{min-height:0}
.hr .dg svg{display:block;width:100%;height:auto}

@media(orientation:landscape) and (min-width:640px){
  main{padding:6px 8px}
  .hg{
    display:grid;
    grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
    gap:8px;
    align-items:stretch;
    height:calc(100vh - 58px);
    height:calc(100dvh - 58px);
  }
  .hg .c{margin:0}
  .hg .mix{height:100%;display:flex;gap:4px;padding:8px 6px;min-height:0}
  .mix .sp{height:100%}
  .mix .fb{flex:1;height:auto;min-height:0}
  .hr{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
  .hr .dg{padding:6px;display:flex;align-items:center}
  .hr .gx{display:flex;flex-direction:column;min-height:0;padding:8px}
  .hr .gx canvas{flex:1;height:auto;min-height:0}
}

@media(orientation:portrait){
  .mix .fb{height:36vh}
}

@media not all and (orientation:landscape) and (min-width:640px){

  header #dot{font-size:8px;padding:1px 5px;line-height:12px}
  header #hb{flex:none;margin-left:auto;align-items:center;gap:4px!important}
  header .hbt{height:30px;padding:0 9px;font-size:10px;letter-spacing:.4px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;justify-content:center}

}
